<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Improvise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <aside class="sidebar" id="sidebar">
        <button type="button" class="sidebar-btn" id="play-stop-btn" title="Stop">
          <svg class="icon icon-play hidden" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <svg class="icon icon-stop" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
            <rect x="5" y="5" width="14" height="14" rx="1"></rect>
          </svg>
          <span class="visually-hidden" id="play-stop-label">Stop</span>
        </button>
        <button type="button" class="sidebar-btn" id="metronome-btn" title="Turn metronome on" aria-pressed="false">
          <svg class="icon icon-speaker-on hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <polygon points="4 9 8 9 13 4 13 20 8 15 4 15 4 9"></polygon>
            <path d="M17.5 8.5a5 5 0 0 1 0 7"></path>
            <path d="M20 6a9 9 0 0 1 0 12"></path>
          </svg>
          <svg class="icon icon-speaker-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <polygon points="4 9 8 9 13 4 13 20 8 15 4 15 4 9"></polygon>
            <line x1="17" y1="9" x2="23" y2="15"></line>
            <line x1="23" y1="9" x2="17" y2="15"></line>
          </svg>
          <span class="visually-hidden" id="metronome-label">Turn metronome on</span>
        </button>
        <button type="button" class="sidebar-btn" id="regenerate-btn" title="Regenerate">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
          <span class="visually-hidden">Regenerate</span>
        </button>
        <button type="button" class="sidebar-btn" id="save-btn" title="Save">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
          <span class="visually-hidden">Save</span>
        </button>
        <button type="button" class="sidebar-btn" id="load-btn" title="Load">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
          <span class="visually-hidden">Load</span>
        </button>
        <button type="button" class="sidebar-btn" id="settings-btn" title="Settings">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span class="visually-hidden">Settings</span>
        </button>
      </aside>
      <div class="stage">
        <div class="track" id="track">
          <div class="card side"></div>
          <div class="card active"></div>
          <div class="card side"></div>
          <div class="card side"></div>
        </div>
      </div>

      <div class="modal-overlay hidden" id="save-modal-overlay">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="save-modal-title">
          <div class="modal-header">
            <h2 id="save-modal-title">Save pattern</h2>
            <button type="button" class="modal-close-btn" id="save-close-btn">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
              <span class="visually-hidden">Close</span>
            </button>
          </div>
          <input type="text" class="modal-input" id="save-name-input" placeholder="Name" maxlength="60" />
          <div class="modal-actions">
            <button type="button" class="modal-btn" id="save-cancel-btn">Cancel</button>
            <button type="button" class="modal-btn modal-btn-primary" id="save-confirm-btn">Save</button>
          </div>
        </div>
      </div>

      <div class="modal-overlay hidden" id="load-modal-overlay">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="load-modal-title">
          <div class="modal-header">
            <h2 id="load-modal-title">Load pattern</h2>
            <button type="button" class="modal-close-btn" id="load-close-btn">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
              <span class="visually-hidden">Close</span>
            </button>
          </div>
          <ul class="saved-list" id="saved-list"></ul>
          <div class="modal-actions">
            <button type="button" class="modal-btn" id="load-cancel-btn">Cancel</button>
          </div>
        </div>
      </div>

      <div class="modal-overlay hidden" id="settings-modal-overlay">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-modal-title">
          <div class="modal-header">
            <h2 id="settings-modal-title">Settings</h2>
            <button type="button" class="modal-close-btn" id="settings-close-btn">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
              <span class="visually-hidden">Close</span>
            </button>
          </div>

          <div class="settings-field">
            <span class="settings-label">Mode</span>
            <div class="segmented-control" id="mode-control" role="radiogroup" aria-label="Mode">
              <button type="button" class="segmented-btn" id="mode-chord-btn" role="radio">Chord</button>
              <button type="button" class="segmented-btn" id="mode-scale-btn" role="radio">Scale</button>
            </div>
          </div>

          <div class="settings-field">
            <label class="settings-label" for="length-input">Pattern length</label>
            <input type="number" class="modal-input" id="length-input" min="4" max="32" step="1" />
          </div>

          <div class="settings-field">
            <label class="settings-label" for="tempo-input">Tempo (BPM)</label>
            <input type="number" class="modal-input" id="tempo-input" min="40" max="240" step="1" />
          </div>

          <div class="settings-field">
            <span class="settings-label">Change every</span>
            <div class="settings-field-row">
              <input
                type="number"
                class="modal-input modal-input-inline"
                id="change-every-input"
                min="1"
                max="64"
                step="1"
              />
              <div class="segmented-control" id="change-every-unit-control" role="radiogroup" aria-label="Change every unit">
                <button type="button" class="segmented-btn" id="change-every-beats-btn" role="radio">Beats</button>
                <button type="button" class="segmented-btn" id="change-every-bars-btn" role="radio">Bars</button>
              </div>
            </div>
          </div>

          <div class="modal-actions">
            <button type="button" class="modal-btn" id="settings-cancel-btn">Cancel</button>
            <button type="button" class="modal-btn modal-btn-primary" id="settings-confirm-btn">Save</button>
          </div>
        </div>
      </div>

      <footer class="footer">
        © <a href="https://cephasteom.co.uk" class="footer-link" target="_blank" rel="noopener noreferrer">CephasTeom</a> <span id="footer-year"></span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
