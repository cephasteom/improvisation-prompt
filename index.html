<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>improv-prompt</title>
  </head>
  <body>
    <div id="app">
      <aside class="sidebar" id="sidebar">
        <button type="button" class="sidebar-btn" id="play-stop-btn" title="Stop">
          <svg class="icon icon-play hidden" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <svg class="icon icon-stop" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
            <rect x="5" y="5" width="14" height="14" rx="1"></rect>
          </svg>
          <span class="visually-hidden" id="play-stop-label">Stop</span>
        </button>
        <button type="button" class="sidebar-btn" id="regenerate-btn" title="Regenerate">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
          <span class="visually-hidden">Regenerate</span>
        </button>
        <button type="button" class="sidebar-btn" id="save-btn" title="Save">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
          <span class="visually-hidden">Save</span>
        </button>
        <button type="button" class="sidebar-btn" id="load-btn" title="Load">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
          <span class="visually-hidden">Load</span>
        </button>
        
      </aside>
      <div class="stage">
        <div class="track" id="track">
          <div class="card side"></div>
          <div class="card active"></div>
          <div class="card side"></div>
          <div class="card side"></div>
        </div>
      </div>

      <div class="modal-overlay hidden" id="save-modal-overlay">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="save-modal-title">
          <h2 id="save-modal-title">Save chord list</h2>
          <input type="text" class="modal-input" id="save-name-input" placeholder="Name" maxlength="60" />
          <div class="modal-actions">
            <button type="button" class="modal-btn" id="save-cancel-btn">Cancel</button>
            <button type="button" class="modal-btn modal-btn-primary" id="save-confirm-btn">Save</button>
          </div>
        </div>
      </div>

      <div class="modal-overlay hidden" id="load-modal-overlay">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="load-modal-title">
          <h2 id="load-modal-title">Load chord list</h2>
          <ul class="saved-list" id="saved-list"></ul>
          <div class="modal-actions">
            <button type="button" class="modal-btn" id="load-cancel-btn">Cancel</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
